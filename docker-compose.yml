services:
  postgres:
    image: postgres:16-alpine
    container_name: totem-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: totem_user
      POSTGRES_PASSWORD: totem_dev
      POSTGRES_DB: totem_festival
    ports:
      - "5432:5432"
    volumes:
      - totem_pg_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U totem_user -d totem_festival"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  totem_pg_data:
